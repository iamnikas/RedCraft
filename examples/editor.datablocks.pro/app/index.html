<!-- public/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Flow Editor</title>
    
    <!-- Стили для ReactFlow -->
    <style>
        html, body, #root {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        .react-flow__node {
            border-radius: 3px;
            border: 1px solid #ddd;
            padding: 10px;
            background: white;
        }

        .nodrag {
            pointer-events: all !important;
        }

        .nowheel {
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
</body>
</html>
